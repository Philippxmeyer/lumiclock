<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Tiefes Nacht-Hintergrund-Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#0d1b2e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>

    <!-- Glühendes Zifferblatt -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a2a4a;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#0d1a30;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050d1a;stop-opacity:1"/>
    </radialGradient>

    <!-- NeoPixel Ring Glow -->
    <radialGradient id="neoGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb347;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffb347;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="neoGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="neoGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#64dfdf;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#64dfdf;stop-opacity:0"/>
    </radialGradient>

    <!-- Mond Schimmer -->
    <radialGradient id="moonGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#e8e8f0"/>
      <stop offset="60%" style="stop-color:#c8c8e0"/>
      <stop offset="100%" style="stop-color:#8888aa"/>
    </radialGradient>

    <!-- Rotes Zeit-Glow -->
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sanfter Schein für Icons -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Starkes Glow für den Titel -->
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- NeoPixel Halo -->
    <filter id="neoHalo">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip für Mondphase -->
    <clipPath id="moonClip">
      <circle cx="200" cy="200" r="62"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════════════ HINTERGRUND -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Subtile Sternenpunkte -->
  <g opacity="0.5">
    <circle cx="80"  cy="30"  r="1"   fill="#ffffff" opacity="0.6"/>
    <circle cx="180" cy="15"  r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="320" cy="45"  r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="450" cy="20"  r="0.7" fill="#ffffff" opacity="0.3"/>
    <circle cx="560" cy="50"  r="1"   fill="#ffffff" opacity="0.5"/>
    <circle cx="700" cy="25"  r="0.9" fill="#ffffff" opacity="0.6"/>
    <circle cx="820" cy="40"  r="1.1" fill="#ffffff" opacity="0.4"/>
    <circle cx="950" cy="18"  r="0.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="1050" cy="55" r="1"   fill="#ffffff" opacity="0.3"/>
    <circle cx="1150" cy="30" r="1.3" fill="#ffffff" opacity="0.5"/>
    <circle cx="130" cy="360" r="0.9" fill="#ffffff" opacity="0.4"/>
    <circle cx="280" cy="375" r="1"   fill="#ffffff" opacity="0.6"/>
    <circle cx="420" cy="355" r="0.7" fill="#ffffff" opacity="0.3"/>
    <circle cx="870" cy="370" r="1.1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1020" cy="358" r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="1140" cy="380" r="1"  fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Subtile horizontale Trennlinie oben & unten -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1a3050" stroke-width="1" opacity="0.8"/>
  <line x1="0" y1="399" x2="1200" y2="399" stroke="#1a3050" stroke-width="1" opacity="0.8"/>

  <!-- ═══════════════════════════════════════════════════ UHRZEIT-FACE (links) -->
  <!-- Äußerer Halo-Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#1a3a6a" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#1a3a6a" stroke-width="0.5" opacity="0.3"/>

  <!-- Zifferblatt -->
  <circle cx="200" cy="200" r="115" fill="url(#clockGlow)" stroke="#1e3d6e" stroke-width="2"/>

  <!-- NeoPixel Ring — 8 LEDs -->
  <!-- LED 1 — Warmweiß oben -->
  <circle cx="200" cy="85" r="10" fill="url(#neoGlow1)" filter="url(#neoHalo)" opacity="0.9"/>
  <circle cx="200" cy="85" r="5" fill="#ffcf7a"/>
  <!-- LED 2 — oben rechts, rot -->
  <circle cx="281" cy="119" r="10" fill="url(#neoGlow2)" filter="url(#neoHalo)" opacity="0.7"/>
  <circle cx="281" cy="119" r="5" fill="#ff8888"/>
  <!-- LED 3 — rechts, cyan -->
  <circle cx="315" cy="200" r="10" fill="url(#neoGlow3)" filter="url(#neoHalo)" opacity="0.9"/>
  <circle cx="315" cy="200" r="5" fill="#64dfdf"/>
  <!-- LED 4 — unten rechts, warm -->
  <circle cx="281" cy="281" r="10" fill="url(#neoGlow1)" filter="url(#neoHalo)" opacity="0.8"/>
  <circle cx="281" cy="281" r="5" fill="#ffb347"/>
  <!-- LED 5 — unten, aus -->
  <circle cx="200" cy="315" r="6" fill="#1a2a3a" stroke="#1e3d6e" stroke-width="1"/>
  <!-- LED 6 — unten links, aus -->
  <circle cx="119" cy="281" r="6" fill="#1a2a3a" stroke="#1e3d6e" stroke-width="1"/>
  <!-- LED 7 — links, warmweiß -->
  <circle cx="85" cy="200" r="10" fill="url(#neoGlow1)" filter="url(#neoHalo)" opacity="0.6"/>
  <circle cx="85" cy="200" r="5" fill="#ffcf7a"/>
  <!-- LED 8 — oben links, aus -->
  <circle cx="119" cy="119" r="6" fill="#1a2a3a" stroke="#1e3d6e" stroke-width="1"/>

  <!-- Stunden-Markierungen -->
  <g stroke="#2a4a7a" stroke-width="1.5" opacity="0.7">
    <line x1="200" y1="100" x2="200" y2="112"/>
    <line x1="257" y1="116" x2="251" y2="126"/>
    <line x1="300" y1="157" x2="292" y2="163"/>
    <line x1="316" y1="200" x2="305" y2="200"/>
    <line x1="300" y1="243" x2="292" y2="237"/>
    <line x1="257" y1="284" x2="251" y2="274"/>
    <line x1="200" y1="300" x2="200" y2="288"/>
    <line x1="143" y1="284" x2="149" y2="274"/>
    <line x1="100" y1="243" x2="108" y2="237"/>
    <line x1="84"  y1="200" x2="95"  y2="200"/>
    <line x1="100" y1="157" x2="108" y2="163"/>
    <line x1="143" y1="116" x2="149" y2="126"/>
  </g>

  <!-- Zeiger — 21:11 -->
  <!-- Stundenzeiger -->
  <line x1="200" y1="200" x2="200" y2="142"
        stroke="#4a8aaa" stroke-width="5" stroke-linecap="round"
        transform="rotate(330, 200, 200)" filter="url(#softGlow)"/>
  <!-- Minutenzeiger -->
  <line x1="200" y1="200" x2="200" y2="128"
        stroke="#5aaad0" stroke-width="3.5" stroke-linecap="round"
        transform="rotate(66, 200, 200)" filter="url(#softGlow)"/>
  <!-- Sekundenzeiger (dekorativ) -->
  <line x1="200" y1="215" x2="200" y2="125"
        stroke="#ff4040" stroke-width="1.5" stroke-linecap="round"
        transform="rotate(210, 200, 200)" filter="url(#redGlow)" opacity="0.8"/>

  <!-- Mittelachse -->
  <circle cx="200" cy="200" r="5" fill="#5aaad0"/>
  <circle cx="200" cy="200" r="2" fill="#ffffff"/>

  <!-- Digitale Uhrzeit im Zifferblatt -->
  <text x="200" y="245" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="13" fill="#ff4040" letter-spacing="3"
        filter="url(#redGlow)" opacity="0.9">21:11</text>

  <!-- ═══════════════════════════════════════════════════ MONDPHASE (links, klein) -->
  <!-- Mondscheibe -->
  <circle cx="200" cy="200" r="62" fill="url(#moonGrad)" clip-path="url(#moonClip)" opacity="0"/>
  <!-- Kleiner Mond oben rechts am Clock-Face als Deko -->
  <g transform="translate(288, 108)">
    <circle cx="0" cy="0" r="18" fill="#c8c8e0" opacity="0.15" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="14" fill="#d8d8f0" opacity="0.2"/>
    <circle cx="5" cy="-3" r="14" fill="#0d1b2e" opacity="0.85"/>
  </g>

  <!-- ═══════════════════════════════════════════════════ HAUPTTITEL (mitte) -->

  <!-- LUMI — großer Schriftzug -->
  <text x="600" y="185"
        text-anchor="middle"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="110"
        font-weight="900"
        letter-spacing="-2"
        fill="#d0e8ff"
        filter="url(#titleGlow)"
        opacity="0.95">LUMI</text>

  <!-- CLOCK — darunter, schlanker -->
  <text x="600" y="270"
        text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="52"
        font-weight="400"
        letter-spacing="20"
        fill="#5aaad0"
        filter="url(#softGlow)"
        opacity="0.9">CLOCK</text>

  <!-- Horizontale Zierlinien um den Titel -->
  <line x1="390" y1="210" x2="460" y2="210" stroke="#2a4a7a" stroke-width="1" opacity="0.7"/>
  <line x1="740" y1="210" x2="810" y2="210" stroke="#2a4a7a" stroke-width="1" opacity="0.7"/>
  <circle cx="465" cy="210" r="2" fill="#5aaad0" opacity="0.6"/>
  <circle cx="735" cy="210" r="2" fill="#5aaad0" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="318"
        text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="11"
        letter-spacing="4"
        fill="#3a6a9a"
        opacity="0.8">ESP32 · TOUCH · WEATHER · MOON · NEOPIXEL</text>

  <!-- ═══════════════════════════════════════════════════ WETTER-ICON (rechts) -->
  <g transform="translate(1000, 200)">
    <!-- Äußerer Kreis -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#1a3a6a" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="105" fill="url(#clockGlow)" stroke="#1e3d6e" stroke-width="2"/>

    <!-- Sonne -->
    <circle cx="-15" cy="-20" r="38" fill="none" stroke="#ffb347" stroke-width="2"
            opacity="0.3" filter="url(#neoHalo)"/>
    <circle cx="-15" cy="-20" r="30" fill="#ffcf7a" opacity="0.85" filter="url(#softGlow)"/>
    <circle cx="-15" cy="-20" r="22" fill="#ffe0a0" opacity="0.9"/>

    <!-- Sonnenstrahlen -->
    <g stroke="#ffb347" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="-15" y1="-58" x2="-15" y2="-50"/>
      <line x1="13"  y1="-48" x2="9"   y2="-42"/>
      <line x1="27"  y1="-20" x2="19"  y2="-20"/>
      <line x1="13"  y1="8"   x2="9"   y2="2"/>
      <line x1="-15" y1="18"  x2="-15" y2="10"/>
      <line x1="-43" y1="8"   x2="-39" y2="2"/>
      <line x1="-57" y1="-20" x2="-49" y2="-20"/>
      <line x1="-43" y1="-48" x2="-39" y2="-42"/>
    </g>

    <!-- Wolke davor -->
    <g opacity="0.92">
      <circle cx="20"  cy="18" r="22" fill="#c8d8e8"/>
      <circle cx="45"  cy="12" r="26" fill="#d8e8f0"/>
      <circle cx="70"  cy="18" r="20" fill="#c8d8e8"/>
      <circle cx="-5"  cy="22" r="16" fill="#b8c8d8"/>
      <rect x="-10" y="22" width="95" height="20" rx="3" fill="#c8d8e8"/>
    </g>

    <!-- Regentropfen -->
    <g fill="#5aaad0" opacity="0.8" filter="url(#softGlow)">
      <ellipse cx="10"  cy="55" rx="3" ry="6"/>
      <ellipse cx="30"  cy="62" rx="3" ry="6"/>
      <ellipse cx="50"  cy="55" rx="3" ry="6"/>
      <ellipse cx="70"  cy="62" rx="3" ry="6"/>
    </g>

    <!-- Temperatur-Anzeige -->
    <text x="0" y="95"
          text-anchor="middle"
          font-family="'Courier New', monospace"
          font-size="14" fill="#ff4040"
          letter-spacing="2"
          filter="url(#redGlow)" opacity="0.9">18°C</text>
  </g>

  <!-- ═══════════════════════════════════════════════════ GITHUB BADGE -->
  <g transform="translate(600, 368)">
    <rect x="-110" y="-14" width="220" height="22" rx="11"
          fill="#0d1b2e" stroke="#1e3d6e" stroke-width="1" opacity="0.8"/>
    <text x="0" y="3"
          text-anchor="middle"
          font-family="'Courier New', monospace"
          font-size="9"
          letter-spacing="2"
          fill="#3a6a9a"
          opacity="0.9">github.com/Philippxmeyer/lumiclock</text>
  </g>

  <!-- ═══════════════════════════════════════════════════ DEKORATIVE ECKELEMENTE -->
  <!-- Oben links -->
  <g stroke="#1e3d6e" stroke-width="1" opacity="0.5" fill="none">
    <polyline points="10,30 10,10 30,10"/>
  </g>
  <!-- Oben rechts -->
  <g stroke="#1e3d6e" stroke-width="1" opacity="0.5" fill="none">
    <polyline points="1170,10 1190,10 1190,30"/>
  </g>
  <!-- Unten links -->
  <g stroke="#1e3d6e" stroke-width="1" opacity="0.5" fill="none">
    <polyline points="10,370 10,390 30,390"/>
  </g>
  <!-- Unten rechts -->
  <g stroke="#1e3d6e" stroke-width="1" opacity="0.5" fill="none">
    <polyline points="1170,390 1190,390 1190,370"/>
  </g>

  <!-- Vertikale Trennlinien zwischen den drei Panels -->
  <line x1="370" y1="40" x2="370" y2="360" stroke="#1a3050" stroke-width="1" opacity="0.4"/>
  <line x1="830" y1="40" x2="830" y2="360" stroke="#1a3050" stroke-width="1" opacity="0.4"/>

</svg>
